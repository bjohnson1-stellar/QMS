            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
          Children:
            - St_PageHeader:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Height: =64
                  FillPortions: =0
                  Fill: =ThemeNavy
                  BorderThickness: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - St_PageTitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =16
                        Width: =400
                        Height: =32
                        Text: ="Settings"
                        Font: =Font.'Segoe UI'
                        Size: =22
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(255, 255, 255, 1)
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - St_PageSubtitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =40
                        Width: =600
                        Height: =20
                        Text: ="App configuration, code references, and about info"
                        Font: =Font.'Segoe UI'
                        Size: =12
                        FontWeight: =FontWeight.Normal
                        Color: =ThemeTextSubtle
                        VerticalAlign: =VerticalAlign.Top
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - St_NotifBell:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 104
                        Y: =12
                        Width: =40
                        Height: =40
                        Icon: ="Alert"
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        IconStyle: ='ButtonCanvas.IconStyle'.Outline
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =ThemeBgCard
                        BasePaletteColor: =ThemeAccent
                        AccessibleLabel: ="Expiring qualifications"
                        OnSelect: |-
                          =Set(showNotifications, !showNotifications); Set(showProfileMenu, false)
                  - St_NotifBadge:
                      Control: Rectangle
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Fill: =StatusExpired
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - St_NotifBadgeText:
                      Control: ModernText
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Text: |-
                          =Text(CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())))
                        Color: =RGBA(255, 255, 255, 1)
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Font: =Font.'Segoe UI'
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - St_UserAvatar:
                      Control: Avatar
                      Properties:
