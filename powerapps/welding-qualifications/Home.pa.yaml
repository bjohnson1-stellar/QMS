            - Hm_NotifDivider:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =72
                  Width: =Parent.Width
                  Height: =1
                  Fill: =ThemeBorder
                  BorderThickness: =0
            - Hm_NotifGallery:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =0
                  Y: =73
                  Width: =Parent.Width
                  Height: =Parent.Height - 73
                  TemplateSize: =64
                  TemplatePadding: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  ShowScrollbar: =true
                  Items: |-
                    =SortByColumns(
                      Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today()),
                      "ExpirationDate", SortOrder.Ascending
                    )
                Children:
                  - Hm_NotifRowDivider:
                      Control: Rectangle
                      Properties:
                        X: =0
                        Y: =Parent.TemplateHeight - 1
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =ThemeBgSubtle
                        BorderThickness: =0
                  - Hm_NotifRowName:
                      Control: ModernText
                      Properties:
                        X: =20
                        Y: =10
                        Width: =220
                        Height: =22
                        Text: =Coalesce(ThisItem.Title, "(Unknown)")
                        Font: =Font.'Segoe UI'
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Color: =ThemeText
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Hm_NotifRowSub:
                      Control: ModernText
                      Properties:
                        X: =20
                        Y: =34
                        Width: =220
                        Height: =18
                        Text: =Coalesce(ThisItem.WPSNumber, "")
                        Font: =Font.'Segoe UI'
                        Size: =11
                        FontWeight: =FontWeight.Normal
                        Color: =ThemeTextMuted
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Hm_NotifRowDate:
                      Control: ModernText
                      Properties:
                        X: =Parent.TemplateWidth - 96
                        Y: =22
                        Width: =84
                        Height: =22
                        Text: =Text(ThisItem.ExpirationDate, "mmm d, yyyy") & " (" & If(IsBlank(ThisItem.ExpirationDate), "—", DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days) < 0, Abs(DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days)) & " days ago", DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days) & " days") & ")"
                        Font: =Font.'Segoe UI'
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Color: =StatusExpiringSoon
                        Align: =Align.Right
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
            - Hm_NotifEmpty:
                Control: ModernText
                Properties:
                  X: =20
                  Y: =180
                  Width: =Parent.Width - 40
                  Height: =40
                  Text: ="No qualifications expiring in the next 30 days."
                  Font: =Font.'Segoe UI'
                  Size: =13
                  FontWeight: =FontWeight.Normal
                  Color: =ThemeTextMuted
                  Align: =Align.Center
                  Wrap: =true
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  Visible: |-
                    =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) = 0
