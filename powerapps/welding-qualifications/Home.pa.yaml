Screens:
  Home:
    Properties:
      Fill: =ThemeBgPage
      OnVisible: =Set(activeNav, "Home")
    Children:
      - Hm_NavRail:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =160
            Height: =Parent.Height
            Fill: =ThemeNavyDeep
            BorderThickness: =0
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
          Children:
            - Hm_NavBtnHome:
                Control: Button
                Properties:
                  X: =8
                  Y: =24
                  Width: =144
                  Height: =48
                  Icon: ="Home"
                  Text: ="Home"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  BasePaletteColor: =ThemeAccent
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  BorderRadius: =8
                  OnSelect: =Navigate(Home)
                  AccessibleLabel: ="Home"
            - Hm_NavBtnWelders:
                Control: Button
                Properties:
                  X: =8
                  Y: =84
                  Width: =144
                  Height: =48
                  Icon: ="Person"
                  Text: ="Welders"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  BorderRadius: =8
                  OnSelect: =Navigate(Welders)
                  AccessibleLabel: ="Welders"
            - Hm_NavBtnWPS:
                Control: Button
                Properties:
                  X: =8
                  Y: =144
                  Width: =144
                  Height: =48
                  Icon: ="DocumentBulletList"
                  Text: ="WPS"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  BorderRadius: =8
                  OnSelect: =Navigate(WPS)
                  AccessibleLabel: ="WPS"
            - Hm_NavBtnPQR:
                Control: Button
                Properties:
                  X: =8
                  Y: =204
                  Width: =144
                  Height: =48
                  Icon: ="DocumentEdit"
                  Text: ="PQR"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  BorderRadius: =8
                  OnSelect: =Navigate(PQR)
                  AccessibleLabel: ="PQR"
            - Hm_NavBtnWPQ:
                Control: Button
                Properties:
                  X: =8
                  Y: =264
                  Width: =144
                  Height: =48
                  Icon: ="Ribbon"
                  Text: ="WPQ"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  BorderRadius: =8
                  OnSelect: =Navigate(WPQ)
                  AccessibleLabel: ="WPQ"
            - Hm_NavBtnDocuments:
                Control: Button
                Properties:
                  X: =8
                  Y: =324
                  Width: =144
                  Height: =48
                  Icon: ="Folder"
                  Text: ="Documents"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  BorderRadius: =8
                  OnSelect: =Navigate(Documents)
                  AccessibleLabel: ="Documents"
            - Hm_NavBtnSettings:
                Control: Button
                Properties:
                  X: =8
                  Y: =384
                  Width: =144
                  Height: =48
                  Icon: ="Settings"
                  Text: ="Settings"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  BorderRadius: =8
                  OnSelect: =Navigate(Settings)
                  AccessibleLabel: ="Settings"
      - Hm_PageShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =160
            Y: =0
            Width: =Parent.Width - 160
            Height: =Parent.Height
            Fill: =ThemeBgPage
            BorderThickness: =0
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
          Children:
            - Hm_PageHeader:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Height: =72
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =ThemeBgCard
                  BorderColor: =ThemeBorder
                  BorderThickness: =1
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - Hm_PageTitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =16
                        Width: =520
                        Height: =32
                        Text: ="Welding Qualifications Dashboard"
                        Size: =22
                        FontWeight: =FontWeight.Bold
                        Color: =ThemeText
                        Font: =Font.'Segoe UI'
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Hm_PageSubtitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =46
                        Width: =520
                        Height: =18
                        Text: =Concatenate("As of ", Text(Today(), "mmm d, yyyy"))
                        Size: =12
                        FontWeight: =FontWeight.Normal
                        Color: =ThemeTextMuted
                        Font: =Font.'Segoe UI'
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Hm_NotifBell:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 104
                        Y: =12
                        Width: =40
                        Height: =40
                        Icon: ="Alert"
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        IconStyle: ='ButtonCanvas.IconStyle'.Outline
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =ThemeBgCard
                        BasePaletteColor: =ThemeAccent
                        AccessibleLabel: ="Expiring qualifications"
                        OnSelect: |-
                          =Set(showNotifications, !showNotifications); Set(showProfileMenu, false)
                  - Hm_NotifBadge:
                      Control: Rectangle
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Fill: =StatusExpired
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Hm_NotifBadgeText:
                      Control: ModernText
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Text: |-
                          =Text(CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())))
                        Color: =RGBA(255, 255, 255, 1)
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Font: =Font.'Segoe UI'
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Hm_UserAvatar:
                      Control: Avatar
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Name: =User().FullName
                        Image: =User().Image
                        Shape: ='Avatar.Shape'.Circular
                        Appearance: ='Avatar.Appearance'.Colorful
                        AccessibleLabel: ="Current user — " & User().FullName
                  - Hm_UserAvatarClick:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Text: =""
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BasePaletteColor: =RGBA(0, 0, 0, 0.001)
                        BorderThickness: =0
                        BorderRadius: =20
                        AccessibleLabel: ="Open user menu"
                        OnSelect: |-
                          =Set(showProfileMenu, !showProfileMenu); Set(showNotifications, false)
            - Hm_PageContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =ThemeBgPage
                  BorderThickness: =0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =24
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  PaddingBottom: =24
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - Hm_KpiRow:
                      Control: GroupContainer
                      Variant: GridLayout
                      Properties:
                        Height: =140
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        LayoutGap: =16
                        LayoutGridColumns: =4
                        LayoutGridRows: =1
                        LayoutGridColumnMinWidth: =200
                        LayoutGridRowMinHeight: =120
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - Hm_KpiActiveWelders:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Fill: =ThemeBgCard
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              DropShadow: =DropShadow.Light
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                            Children:
                              - Hm_KpiActiveBar:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =6
                                    Height: =Parent.Height
                                    Fill: =ThemeAccent
                                    BorderThickness: =0
                              - Hm_KpiActiveValue:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =20
                                    Width: =Parent.Width - 40
                                    Height: =56
                                    Text: =Text(CountRows(Filter('Welder Registry', Status.Value = "Active")))
                                    Size: =40
                                    FontWeight: =FontWeight.Bold
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_KpiActiveLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =84
                                    Width: =Parent.Width - 40
                                    Height: =18
                                    Text: ="Active welders"
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                        - Hm_KpiCurrentQuals:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Fill: =ThemeBgCard
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              DropShadow: =DropShadow.Light
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                            Children:
                              - Hm_KpiCurrentBar:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =6
                                    Height: =Parent.Height
                                    Fill: =StatusCurrent
                                    BorderThickness: =0
                              - Hm_KpiCurrentValue:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =20
                                    Width: =Parent.Width - 40
                                    Height: =56
                                    Text: =Text(CountRows(Filter('WPQ Qualifications', !IsBlank(ExpirationDate) && DateDiff(Today(), ExpirationDate, TimeUnit.Days) > 30)))
                                    Size: =40
                                    FontWeight: =FontWeight.Bold
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_KpiCurrentLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =84
                                    Width: =Parent.Width - 40
                                    Height: =18
                                    Text: ="Current qualifications"
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                        - Hm_KpiExpiringSoon:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Fill: =ThemeBgCard
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              DropShadow: =DropShadow.Light
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                            Children:
                              - Hm_KpiExpiringBar:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =6
                                    Height: =Parent.Height
                                    Fill: =StatusExpiringSoon
                                    BorderThickness: =0
                              - Hm_KpiExpiringValue:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =20
                                    Width: =Parent.Width - 40
                                    Height: =56
                                    Text: =Text(CountRows(Filter('WPQ Qualifications', DateDiff(Today(), ExpirationDate, TimeUnit.Days) >= 0 && DateDiff(Today(), ExpirationDate, TimeUnit.Days) <= 30)))
                                    Size: =40
                                    FontWeight: =FontWeight.Bold
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_KpiExpiringLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =84
                                    Width: =Parent.Width - 40
                                    Height: =18
                                    Text: ="Expiring within 30 days"
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                        - Hm_KpiExpired:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Fill: =ThemeBgCard
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              DropShadow: =DropShadow.Light
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                            Children:
                              - Hm_KpiExpiredBar:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =6
                                    Height: =Parent.Height
                                    Fill: =StatusExpired
                                    BorderThickness: =0
                              - Hm_KpiExpiredValue:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =20
                                    Width: =Parent.Width - 40
                                    Height: =56
                                    Text: =Text(CountRows(Filter('WPQ Qualifications', !IsBlank(ExpirationDate) && DateDiff(Today(), ExpirationDate, TimeUnit.Days) < 0)))
                                    Size: =40
                                    FontWeight: =FontWeight.Bold
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_KpiExpiredLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =20
                                    Y: =84
                                    Width: =Parent.Width - 40
                                    Height: =18
                                    Text: ="Expired qualifications"
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                  - Hm_ExpiringSection:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Height: =440
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =ThemeBgCard
                        BorderColor: =ThemeBorder
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DropShadow: =DropShadow.Light
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        PaddingTop: =20
                        PaddingBottom: =20
                        PaddingLeft: =24
                        PaddingRight: =24
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - Hm_ExpiringHeading:
                            Control: ModernText
                            Properties:
                              Height: =26
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="Upcoming Expirations"
                              Size: =18
                              FontWeight: =FontWeight.Semibold
                              Color: =ThemeText
                              Font: =Font.'Segoe UI'
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - Hm_ExpiringSubheading:
                            Control: ModernText
                            Properties:
                              Height: =18
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="Welder qualifications expiring within 90 days, sorted by date."
                              Size: =12
                              FontWeight: =FontWeight.Normal
                              Color: =ThemeTextMuted
                              Font: =Font.'Segoe UI'
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - Hm_ExpiringGallery:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Items: =SortByColumns(Filter('WPQ Qualifications', 0 <= WarningWindow90), "ExpirationDate", SortOrder.Ascending)
                              TemplateSize: =64
                              TemplatePadding: =0
                              ShowScrollbar: =true
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                            Children:
                              - Hm_RowDivider:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =63
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =ThemeBorder
                                    BorderThickness: =0
                              - Hm_RowStamp:
                                  Control: ModernText
                                  Properties:
                                    X: =0
                                    Y: =14
                                    Width: =140
                                    Height: =20
                                    Text: =ThisItem.WelderStamp
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_RowStampSub:
                                  Control: ModernText
                                  Properties:
                                    X: =0
                                    Y: =34
                                    Width: =140
                                    Height: =16
                                    Text: =ThisItem.WPSNumber
                                    Size: =11
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Font: =Font.'Segoe UI'
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_RowTitle:
                                  Control: ModernText
                                  Properties:
                                    X: =152
                                    Y: =14
                                    Width: =Parent.TemplateWidth - 460
                                    Height: =40
                                    Text: =ThisItem.Title
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_RowExpDate:
                                  Control: ModernText
                                  Properties:
                                    X: =Parent.TemplateWidth - 300
                                    Y: =22
                                    Width: =160
                                    Height: =20
                                    Text: =Text(ThisItem.ExpirationDate, "mmm d, yyyy") & " (" & If(IsBlank(ThisItem.ExpirationDate), "—", DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days) < 0, Abs(DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days)) & " days ago", DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days) & " days") & ")"
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    Align: =Align.Right
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Hm_RowBadge:
                                  Control: Badge
                                  Properties:
                                    X: =Parent.TemplateWidth - 130
                                    Y: =20
                                    Width: =120
                                    Height: =24
                                    Content: ="Current"
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    BasePaletteColor: =If(IsBlank(ThisItem.ExpirationDate), StatusInactive, DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days) < 0, StatusExpired, DateDiff(Today(), ThisItem.ExpirationDate, TimeUnit.Days) <= 30, StatusExpiringSoon, StatusCurrent)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                              - Hm_RowClickOverlay:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =64
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =ThemeBgSubtle
                                    PressedFill: =ThemeBgSubtle
                                    BorderThickness: =0
                                    OnSelect: |-
                                      =Set(selectedWPQ, ThisItem);
                                      Navigate(WPQ)
                  - Hm_QuickLinksRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Height: =72
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =ThemeBgCard
                        BorderColor: =ThemeBorder
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DropShadow: =DropShadow.Light
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =24
                        PaddingRight: =24
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - Hm_QuickWelders:
                            Control: Button
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="Open Welders"
                              Icon: ="PeopleTeam"
                              Layout: ='ButtonCanvas.Layout'.IconBefore
                              IconStyle: ='ButtonCanvas.IconStyle'.Outline
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              BasePaletteColor: =ThemeAccent
                              FontSize: =13
                              FontWeight: =FontWeight.Semibold
                              BorderRadius: =6
                              OnSelect: =Navigate(Welders)
                        - Hm_QuickWPS:
                            Control: Button
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="Open WPS Library"
                              Icon: ="DocumentBulletList"
                              Layout: ='ButtonCanvas.Layout'.IconBefore
                              IconStyle: ='ButtonCanvas.IconStyle'.Outline
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              BasePaletteColor: =ThemeAccent
                              FontSize: =13
