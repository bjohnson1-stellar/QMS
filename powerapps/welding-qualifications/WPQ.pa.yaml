                                    OnSelect: |-
                                      =If(!IsBlank(selectedWPQ) && !IsBlank(selectedWPQ.WPSNumber),
                                        Set(selectedWPS, LookUp(colWPS, WPSNumber = selectedWPQ.WPSNumber));
                                        Navigate(WPS)
                                      )
                                    AlignInContainer: =AlignInContainer.Center
                              - Wpq_OpenSharePointButton:
                                  Control: Button
                                  Properties:
                                    Width: =220
                                    Height: =40
                                    FillPortions: =0
                                    Text: ="Open in SharePoint"
                                    Icon: ="FolderOpen"
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    Appearance: ='ButtonCanvas.Appearance'.Subtle
                                    BasePaletteColor: =ThemeSteel
                                    FontSize: =13
                                    FontWeight: =FontWeight.Semibold
                                    Font: =Font.'Segoe UI'
                                    OnSelect: =Launch(DocLibraryUrl)
                                    AlignInContainer: =AlignInContainer.Center
                        - Wpq_ContinuityCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =128
                              FillPortions: =0
                              Fill: =RGBA(255, 248, 230, 1)
                              BorderColor: =StatusExpiringSoon
                              BorderThickness: =1
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutAlignItems: =LayoutAlignItems.Start
                              PaddingTop: =14
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Stretch
                            Children:
                              - Wpq_ContinuityHeader:
                                  Control: ModernText
                                  Properties:
                                    Height: =22
                                    FillPortions: =0
                                    Text: ="Continuity Reminder — ASME IX QW-322"
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Color: =StatusExpiringSoon
                                    Font: =Font.'Segoe UI'
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    Wrap: =false
                                    AlignInContainer: =AlignInContainer.Stretch
                              - Wpq_ContinuityBody:
                                  Control: ModernText
                                  Properties:
                                    FillPortions: =1
                                    Text: ="Inactivity exceeding 6 months invalidates a welder's qualification per ASME IX QW-322. AWS D1.1 §4.20 requires periodic requalification — see Continuity Log for verification activity. Maintain ongoing weld activity records and re-test before the expiration date above."
                                    Size: =12
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeText
                                    Font: =Font.'Segoe UI'
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                        - Wpq_DocsHeader:
                            Control: ModernText
                            Properties:
                              Height: =24
                              FillPortions: =0
                              Text: ="Supporting Documents"
                              Size: =16
                              FontWeight: =FontWeight.Semibold
                              Color: =ThemeText
                              Font: =Font.'Segoe UI'
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              Wrap: =false
                              AlignInContainer: =AlignInContainer.Stretch
                        - Wpq_DocsBody:
                            Control: ModernText
                            Properties:
                              Height: =40
                              FillPortions: =0
                              Text: ="Test certificates, radiograph reports, and qualification records are stored in the SharePoint document library. Use the button above to open the library and navigate to the WPQ folder for this welder."
                              Size: =12
                              FontWeight: =FontWeight.Normal
                              Color: =ThemeTextMuted
                              Font: =Font.'Segoe UI'
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AlignInContainer: =AlignInContainer.Stretch
