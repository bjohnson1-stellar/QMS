                  ShowScrollbar: =true
                  Items: |-
                    =SortByColumns(
                      Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today()),
                      "ExpirationDate", SortOrder.Ascending
                    )
                Children:
                  - Wpq_NotifRowDivider:
                      Control: Rectangle
                      Properties:
                        X: =0
                        Y: =Parent.TemplateHeight - 1
                        Width: =Parent.TemplateWidth
