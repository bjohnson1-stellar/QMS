Screens:
  PQR:
    Properties:
      Fill: =ThemeBgPage
      OnVisible: |-
        =Set(activeNav, "PQR");
        Set(pqrCodeFilter, "");
        Set(pqrSearch, "");
        If(IsBlank(selectedPQR), Set(selectedPQR, First(colPQR)))
    Children:
      - Pqr_NavRail:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =160
            Height: =Parent.Height
            Fill: =ThemeNavyDeep
            BorderThickness: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
          Children:
            - Pqr_NavBtnHome:
                Control: Button
                Properties:
                  X: =8
                  Y: =24
                  Width: =144
                  Height: =48
                  Icon: ="Home"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BasePaletteColor: =ThemeAccent
                  FontColor: =RGBA(255, 255, 255, 1)
                  Text: ="Home"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="Home"
                  OnSelect: =Navigate(Home)
            - Pqr_NavBtnWelders:
                Control: Button
                Properties:
                  X: =8
                  Y: =84
                  Width: =144
                  Height: =48
                  Icon: ="Person"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BasePaletteColor: =ThemeAccent
                  FontColor: =RGBA(255, 255, 255, 1)
                  Text: ="Welders"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="Welders"
                  OnSelect: =Navigate(Welders)
            - Pqr_NavBtnWPS:
                Control: Button
                Properties:
                  X: =8
                  Y: =144
                  Width: =144
                  Height: =48
                  Icon: ="DocumentBulletList"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BasePaletteColor: =ThemeAccent
                  FontColor: =RGBA(255, 255, 255, 1)
                  Text: ="WPS"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="WPS"
                  OnSelect: =Navigate(WPS)
            - Pqr_NavBtnPQR:
                Control: Button
                Properties:
                  X: =8
                  Y: =204
                  Width: =144
                  Height: =48
                  Icon: ="DocumentEdit"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  BasePaletteColor: =ThemeAccent
                  FontColor: =RGBA(255, 255, 255, 1)
                  Text: ="PQR"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="PQR"
                  OnSelect: =false
            - Pqr_NavBtnWPQ:
                Control: Button
                Properties:
                  X: =8
                  Y: =264
                  Width: =144
                  Height: =48
                  Icon: ="Ribbon"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BasePaletteColor: =ThemeAccent
                  FontColor: =RGBA(255, 255, 255, 1)
                  Text: ="WPQ"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="WPQ"
                  OnSelect: =Navigate(WPQ)
            - Pqr_NavBtnDocs:
                Control: Button
                Properties:
                  X: =8
                  Y: =324
                  Width: =144
                  Height: =48
                  Icon: ="Folder"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BasePaletteColor: =ThemeAccent
                  FontColor: =RGBA(255, 255, 255, 1)
                  Text: ="Documents"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="Documents"
                  OnSelect: =Navigate(Documents)
            - Pqr_NavBtnSettings:
                Control: Button
                Properties:
                  X: =8
                  Y: =384
                  Width: =144
                  Height: =48
                  Icon: ="Settings"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BasePaletteColor: =ThemeAccent
                  FontColor: =RGBA(255, 255, 255, 1)
                  Text: ="Settings"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="Settings"
                  OnSelect: =Navigate(Settings)
      - Pqr_PageShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =160
            Y: =0
            Width: =Parent.Width - 160
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            BorderThickness: =0
            Fill: =ThemeBgPage
          Children:
            - Pqr_PageHeader:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Height: =64
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =ThemeNavy
                  BorderThickness: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                Children:
                  - Pqr_PageTitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =16
                        Width: =400
                        Height: =32
                        Text: ="Procedure Qualification Records"
                        Font: =Font.'Segoe UI'
                        Size: =20
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(255, 255, 255, 1)
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Pqr_PageSubtitle:
                      Control: ModernText
                      Properties:
                        X: =430
                        Y: =22
                        Width: =400
                        Height: =22
                        Text: ="ASME IX & AWS D1.1 — Test Records"
                        Font: =Font.'Segoe UI'
                        Size: =13
                        FontWeight: =FontWeight.Normal
                        Color: =ThemeTextSubtle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Pqr_NotifBell:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 104
                        Y: =12
                        Width: =40
                        Height: =40
                        Icon: ="Alert"
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        IconStyle: ='ButtonCanvas.IconStyle'.Outline
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =ThemeBgCard
                        BasePaletteColor: =ThemeAccent
                        AccessibleLabel: ="Expiring qualifications"
                        OnSelect: |-
                          =Set(showNotifications, !showNotifications); Set(showProfileMenu, false)
                  - Pqr_NotifBadge:
                      Control: Rectangle
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Fill: =StatusExpired
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Pqr_NotifBadgeText:
                      Control: ModernText
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Text: |-
                          =Text(CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())))
                        Color: =RGBA(255, 255, 255, 1)
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Font: =Font.'Segoe UI'
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Pqr_UserAvatar:
                      Control: Avatar
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Name: =User().FullName
                        Image: =User().Image
                        Shape: ='Avatar.Shape'.Circular
                        Appearance: ='Avatar.Appearance'.Colorful
                        AccessibleLabel: ="Current user — " & User().FullName
                  - Pqr_UserAvatarClick:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Text: =""
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BasePaletteColor: =RGBA(0, 0, 0, 0.001)
                        BorderThickness: =0
                        BorderRadius: =20
                        AccessibleLabel: ="Open user menu"
                        OnSelect: |-
                          =Set(showProfileMenu, !showProfileMenu); Set(showNotifications, false)
            - Pqr_PageContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  BorderThickness: =0
                  Fill: =ThemeBgPage
                Children:
                  - Pqr_LeftPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Width: =420
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =ThemeBgCard
                        BorderColor: =ThemeBorder
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DropShadow: =DropShadow.Light
                      Children:
                        - Pqr_LeftPaneTitle:
                            Control: ModernText
                            Properties:
                              Height: =26
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="PQR Library"
                              Font: =Font.'Segoe UI'
                              Size: =18
                              FontWeight: =FontWeight.Semibold
                              Color: =ThemeText
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - Pqr_CodeFilterTabs:
                            Control: ModernTabList
                            Properties:
                              Height: =40
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Items: |-
                                =Table(
                                  {Value: "All"},
                                  {Value: "ASME IX"},
                                  {Value: "AWS D1.1"}
                                )
                              ItemDisplayText: =ThisItem.Value
                              Default: '={Value: "All"}'
                              Appearance: ='TabListAppearance'.Subtle
                              TabSize: =TabSize.Medium
                              Size: =13
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Normal
                              OnChange: |-
                                =Set(pqrCodeFilter, If(Self.Selected.Value = "All", "", Self.Selected.Value))
                        - Pqr_SearchInput:
                            Control: Classic/TextInput
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Color: =ThemeText
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              Height: =40
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              HintText: ="Search PQR number or title…"
                              Size: =14
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Normal
                              OnChange: =Set(pqrSearch, Self.Text)

                              Mode: =TextMode.SingleLine
                        - Pqr_PQRGallery:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Items: |-
                                =SortByColumns(
                                  Filter(
                                    colPQR,
                                    ((IsBlank(pqrCodeFilter) || pqrCodeFilter = "") || Code = pqrCodeFilter) &&
                                    ((IsBlank(pqrSearch) || pqrSearch = "") || StartsWith(PQRNumber, pqrSearch) || pqrSearch in Title)
                                  ),
                                  "PQRNumber",
                                  SortOrder.Ascending
                                )
                              TemplateSize: =84
                              TemplatePadding: =4
                              Selectable: =true
                              ShowScrollbar: =true
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                            Children:
                              - Pqr_RowBg:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 4
                                    Fill: =If(ThisItem.PQRNumber = selectedPQR.PQRNumber, ThemeBgSubtle, RGBA(0, 0, 0, 0))
                                    HoverFill: =ThemeBgSubtle
                                    PressedFill: =ThemeBgSubtle
                                    BorderColor: =ThemeBorder
                                    BorderThickness: =1
                                    OnSelect: =Set(selectedPQR, ThisItem)
                              - Pqr_RowNumber:
                                  Control: ModernText
                                  Properties:
                                    X: =12
                                    Y: =10
                                    Width: =220
                                    Height: =22
                                    Text: =ThisItem.PQRNumber
                                    Font: =Font.'Segoe UI'
                                    Size: =15
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Pqr_RowCodeBadge:
                                  Control: Badge
                                  Properties:
                                    X: =Parent.TemplateWidth - 110
                                    Y: =12
                                    Width: =92
                                    Height: =22
                                    Content: =ThisItem.Code
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    BasePaletteColor: =If(ThisItem.Code = "ASME IX", CodeASMEColor, CodeAWSColor)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Font: =Font.'Segoe UI'
                              - Pqr_RowTitle:
                                  Control: ModernText
                                  Properties:
                                    X: =12
                                    Y: =34
                                    Width: =Parent.TemplateWidth - 24
                                    Height: =20
                                    Text: =ThisItem.Title
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Pqr_RowMeta:
                                  Control: ModernText
                                  Properties:
                                    X: =12
                                    Y: =56
                                    Width: =Parent.TemplateWidth - 24
                                    Height: =18
                                    Text: '=ThisItem.Process & "  •  " & ThisItem.BaseMetal & "  •  WPS: " & ThisItem.LinkedWPS'
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextSubtle
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                        - Pqr_PQREmpty:
                            Control: ModernText
                            Properties:
                              Height: =48
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =Pqr_PQRGallery.AllItemsCount = 0
                              Text: ="No PQRs match your search."
                              Font: =Font.'Segoe UI'
                              Size: =13
                              FontWeight: =FontWeight.Normal
                              Color: =ThemeTextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =true
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                  - Pqr_RightPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        Fill: =ThemeBgCard
                        BorderColor: =ThemeBorder
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DropShadow: =DropShadow.Light
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - Pqr_DetailHeaderRow:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Height: =56
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                            Children:
                              - Pqr_DetailNumber:
                                  Control: ModernText
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =400
                                    Height: =34
                                    Text: =selectedPQR.PQRNumber
                                    Font: =Font.'Segoe UI'
                                    Size: =28
                                    FontWeight: =FontWeight.Bold
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Pqr_DetailTitle:
                                  Control: ModernText
                                  Properties:
                                    X: =0
                                    Y: =36
                                    Width: =600
                                    Height: =20
                                    Text: =selectedPQR.Title
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Pqr_DetailCodeBadge:
                                  Control: Badge
                                  Properties:
                                    X: =Parent.Width - 130
                                    Y: =6
                                    Width: =120
                                    Height: =28
                                    Content: =selectedPQR.Code
                                    Appearance: ='BadgeCanvas.Appearance'.Filled
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    BasePaletteColor: =If(selectedPQR.Code = "ASME IX", CodeASMEColor, CodeAWSColor)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Font: =Font.'Segoe UI'
                        - Pqr_SectionResultsTitle:
                            Control: ModernText
                            Properties:
                              Height: =24
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="Test Results"
                              Font: =Font.'Segoe UI'
                              Size: =16
                              FontWeight: =FontWeight.Semibold
                              Color: =ThemeText
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - Pqr_ResultsCard:
                            Control: GroupContainer
                            Variant: GridLayout
                            Properties:
                              Height: =320
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutGridColumns: =2
                              LayoutGridRows: =5
                              LayoutGap: =8
                              LayoutGridColumnMinWidth: =200
                              LayoutGridRowMinHeight: =56
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              Fill: =ThemeBgSubtle
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                            Children:
                              - Pqr_CellProcess:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    PaddingTop: =6
                                    PaddingBottom: =6
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                  Children:
                                    - Pqr_LblProcess:
                                        Control: ModernText
                                        Properties:
                                          Height: =16
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="PROCESS"
                                          Font: =Font.'Segoe UI'
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeTextMuted
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - Pqr_ValProcess:
                                        Control: ModernText
                                        Properties:
                                          Height: =22
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: =selectedPQR.Process
                                          Font: =Font.'Segoe UI'
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeText
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - Pqr_CellTestDate:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    PaddingTop: =6
                                    PaddingBottom: =6
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                  Children:
                                    - Pqr_LblTestDate:
                                        Control: ModernText
                                        Properties:
                                          Height: =16
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="TEST DATE"
                                          Font: =Font.'Segoe UI'
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeTextMuted
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - Pqr_ValTestDate:
                                        Control: ModernText
                                        Properties:
                                          Height: =22
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: =Text(selectedPQR.TestDate, "mmm d, yyyy")
                                          Font: =Font.'Segoe UI'
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeText
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - Pqr_CellBaseMetal:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    PaddingTop: =6
                                    PaddingBottom: =6
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                  Children:
                                    - Pqr_LblBaseMetal:
                                        Control: ModernText
                                        Properties:
                                          Height: =16
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="BASE METAL"
                                          Font: =Font.'Segoe UI'
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeTextMuted
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - Pqr_ValBaseMetal:
                                        Control: ModernText
                                        Properties:
                                          Height: =22
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: =selectedPQR.BaseMetal
                                          Font: =Font.'Segoe UI'
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeText
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - Pqr_CellFillerMetal:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    PaddingTop: =6
                                    PaddingBottom: =6
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                  Children:
                                    - Pqr_LblFillerMetal:
                                        Control: ModernText
                                        Properties:
                                          Height: =16
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="FILLER METAL"
                                          Font: =Font.'Segoe UI'
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeTextMuted
                                          Wrap: =false
                                          PaddingTop: =0
