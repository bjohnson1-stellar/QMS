Screens:
  WPS:
    Properties:
      Fill: =ThemeBgPage
      OnVisible: |-
        =Set(activeNav, "WPS");
        Set(wpsCodeFilter, "");
        Set(wpsSearch, "");
        If(IsBlank(selectedWPS), Set(selectedWPS, First(colWPS)))
    Children:
      - Wps_NavRail:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =160
            Height: =Parent.Height
            Fill: =ThemeNavyDeep
            BorderThickness: =0
            DropShadow: =DropShadow.None
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
          Children:
            - Wps_NavHome:
                Control: Button
                Properties:
                  X: =8
                  Y: =24
                  Width: =144
                  Height: =48
                  Icon: ="Home"
                  Text: ="Home"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =ThemeBgCard
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="Home"
                  OnSelect: =Navigate(Home)
            - Wps_NavWelders:
                Control: Button
                Properties:
                  X: =8
                  Y: =84
                  Width: =144
                  Height: =48
                  Icon: ="Person"
                  Text: ="Welders"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =ThemeBgCard
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="Welders"
                  OnSelect: =Navigate(Welders)
            - Wps_NavWPS:
                Control: Button
                Properties:
                  X: =8
                  Y: =144
                  Width: =144
                  Height: =48
                  Icon: ="DocumentBulletList"
                  Text: ="WPS"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="WPS"
                  OnSelect: =Navigate(WPS)
            - Wps_NavPQR:
                Control: Button
                Properties:
                  X: =8
                  Y: =204
                  Width: =144
                  Height: =48
                  Icon: ="DocumentEdit"
                  Text: ="PQR"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =ThemeBgCard
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="PQR"
                  OnSelect: =Navigate(PQR)
            - Wps_NavWPQ:
                Control: Button
                Properties:
                  X: =8
                  Y: =264
                  Width: =144
                  Height: =48
                  Icon: ="Ribbon"
                  Text: ="WPQ"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =ThemeBgCard
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="WPQ"
                  OnSelect: =Navigate(WPQ)
            - Wps_NavDocuments:
                Control: Button
                Properties:
                  X: =8
                  Y: =324
                  Width: =144
                  Height: =48
                  Icon: ="Folder"
                  Text: ="Documents"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =ThemeBgCard
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="Documents"
                  OnSelect: =Navigate(Documents)
            - Wps_NavSettings:
                Control: Button
                Properties:
                  X: =8
                  Y: =384
                  Width: =144
                  Height: =48
                  Icon: ="Settings"
                  Text: ="Settings"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =ThemeBgCard
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="Settings"
                  OnSelect: =Navigate(Settings)
      - Wps_PageShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =160
            Y: =0
            Width: =Parent.Width - 160
            Height: =Parent.Height
            Fill: =ThemeBgPage
            BorderThickness: =0
            DropShadow: =DropShadow.None
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
          Children:
            - Wps_PageHeader:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Height: =72
                  FillPortions: =0
                  Fill: =ThemeNavy
                  BorderThickness: =0
                  DropShadow: =DropShadow.Light
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - Wps_PageTitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =16
                        Width: =520
                        Height: =40
                        Text: ="Welding Procedure Specifications"
                        Font: =Font.'Segoe UI'
                        Size: =22
                        FontWeight: =FontWeight.Bold
                        Color: =ThemeBgCard
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Wps_PageSubtitle:
                      Control: ModernText
                      Properties:
                        X: =548
                        Y: =26
                        Width: =380
                        Height: =22
                        Text: |-
                          ="ASME IX & AWS D1.1 — " & CountRows(colWPS) & " procedures"
                        Font: =Font.'Segoe UI'
                        Size: =13
                        FontWeight: =FontWeight.Normal
                        Color: =ThemeTextSubtle
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Wps_NotifBell:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 104
                        Y: =12
                        Width: =40
                        Height: =40
                        Icon: ="Alert"
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        IconStyle: ='ButtonCanvas.IconStyle'.Outline
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =ThemeBgCard
                        BasePaletteColor: =ThemeAccent
                        AccessibleLabel: ="Expiring qualifications"
                        OnSelect: |-
                          =Set(showNotifications, !showNotifications); Set(showProfileMenu, false)
                  - Wps_NotifBadge:
                      Control: Rectangle
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Fill: =StatusExpired
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Wps_NotifBadgeText:
                      Control: ModernText
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Text: |-
                          =Text(CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())))
                        Color: =RGBA(255, 255, 255, 1)
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Font: =Font.'Segoe UI'
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Wps_UserAvatar:
                      Control: Avatar
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Name: =User().FullName
                        Image: =User().Image
                        Shape: ='Avatar.Shape'.Circular
                        Appearance: ='Avatar.Appearance'.Colorful
                        AccessibleLabel: ="Current user — " & User().FullName
                  - Wps_UserAvatarClick:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Text: =""
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BasePaletteColor: =RGBA(0, 0, 0, 0.001)
                        BorderThickness: =0
                        BorderRadius: =20
                        AccessibleLabel: ="Open user menu"
                        OnSelect: |-
                          =Set(showProfileMenu, !showProfileMenu); Set(showNotifications, false)
            - Wps_PageContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =ThemeBgPage
                  BorderThickness: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - Wps_LeftPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Width: =420
                        FillPortions: =0
                        Fill: =ThemeBgCard
                        BorderColor: =ThemeBorder
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DropShadow: =DropShadow.Light
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - Wps_CodeFilterTabs:
                            Control: ModernTabList
                            Properties:
                              Height: =36
                              FillPortions: =0
                              Items: |-
                                =Table(
                                  {Value: "All", Filter: ""},
                                  {Value: "ASME IX", Filter: "ASME IX"},
                                  {Value: "AWS D1.1", Filter: "AWS D1.1"}
                                )
                              ItemDisplayText: =ThisItem.Value
                              Default: '={Value: "All", Filter: ""}'
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              BasePaletteColor: =ThemeAccent
                              Color: =ThemeText
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              OnChange: =Set(wpsCodeFilter, Self.Selected.Filter)
                              AlignInContainer: =AlignInContainer.Stretch
                        - Wps_SearchInput:
                            Control: Classic/TextInput
                            Properties:
                              Height: =40
                              FillPortions: =0
                              HintText: ="Search WPS number or title..."
                              Font: =Font.'Segoe UI'
                              Size: =13
                              FontWeight: =FontWeight.Normal
                              Color: =ThemeText
                              Fill: =ThemeBgCard
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              OnChange: =Set(wpsSearch, Self.Text)
                              AlignInContainer: =AlignInContainer.Stretch

                              Mode: =TextMode.SingleLine
                        - Wps_WPSGallery:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              FillPortions: =1
                              Items: |-
                                =SortByColumns(
                                  Filter(
                                    colWPS,
                                    ((IsBlank(wpsCodeFilter) || wpsCodeFilter = "") || Code = wpsCodeFilter) &&
                                    ((IsBlank(wpsSearch) || wpsSearch = "") || StartsWith(WPSNumber, wpsSearch) || wpsSearch in Title)
                                  ),
                                  "WPSNumber",
                                  SortOrder.Ascending
                                )
                              TemplateSize: =84
                              TemplatePadding: =4
                              ShowScrollbar: =true
                              ShowNavigation: =false
                              Selectable: =true
                              Fill: =ThemeBgCard
                              BorderThickness: =0
                              AlignInContainer: =AlignInContainer.Stretch
                            Children:
                              - Wps_RowBg:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 4
                                    Fill: |-
                                      =If(
                                        ThisItem.WPSNumber = selectedWPS.WPSNumber,
                                        ThemeBgSubtle,
                                        ThemeBgCard
                                      )
                                    HoverFill: =ThemeBgSubtle
                                    PressedFill: =ThemeBgSubtle
                                    BorderColor: =ThemeBorder
                                    BorderThickness: =1
                                    OnSelect: =Set(selectedWPS, ThisItem)
                              - Wps_ActiveBar:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Height: =Parent.TemplateHeight - 4
                                    Fill: |-
                                      =If(
                                        ThisItem.WPSNumber = selectedWPS.WPSNumber,
                                        ThemeAccent,
                                        RGBA(0,0,0,0)
                                      )
                                    BorderThickness: =0
                              - Wps_WPSNumberLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =16
                                    Y: =10
                                    Width: =200
                                    Height: =22
                                    Text: =ThisItem.WPSNumber
                                    Font: =Font.'Segoe UI'
                                    Size: =15
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wps_CodeBadge:
                                  Control: Badge
                                  Properties:
                                    X: =Parent.TemplateWidth - 110
                                    Y: =12
                                    Width: =92
                                    Height: =22
                                    Content: =ThisItem.Code
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    BasePaletteColor: |-
                                      =If(
                                        ThisItem.Code = "ASME IX",
                                        CodeASMEColor,
                                        CodeAWSColor
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                              - Wps_WPSTitleLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =16
                                    Y: =36
                                    Width: =Parent.TemplateWidth - 32
                                    Height: =20
                                    Text: =ThisItem.Title
                                    Font: =Font.'Segoe UI'
                                    Size: =12
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wps_WPSMetaLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =16
                                    Y: =56
                                    Width: =Parent.TemplateWidth - 32
                                    Height: =18
                                    Text: |-
                                      =ThisItem.Process & "  |  " & ThisItem.BaseMetalPNumber & " / " & ThisItem.FillerFNumber & "  |  " & ThisItem.Revision
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextSubtle
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                        - Wps_WPSEmpty:
                            Control: ModernText
                            Properties:
                              Height: =48
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =Wps_WPSGallery.AllItemsCount = 0
                              Text: ="No WPS records match your search."
                              Font: =Font.'Segoe UI'
                              Size: =13
                              FontWeight: =FontWeight.Normal
                              Color: =ThemeTextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =true
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                  - Wps_RightPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        Fill: =ThemeBgCard
                        BorderColor: =ThemeBorder
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DropShadow: =DropShadow.Light
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =24
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - Wps_DetailHeader:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Height: =84
                              FillPortions: =0
                              Fill: =RGBA(0,0,0,0)
                              BorderThickness: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AlignInContainer: =AlignInContainer.Stretch
                            Children:
                              - Wps_DetailTitle:
                                  Control: ModernText
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =640
                                    Height: =34
                                    Text: =selectedWPS.WPSNumber
                                    Font: =Font.'Segoe UI'
                                    Size: =26
                                    FontWeight: =FontWeight.Bold
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wps_DetailSubtitle:
                                  Control: ModernText
                                  Properties:
                                    X: =0
                                    Y: =36
                                    Width: =640
                                    Height: =22
                                    Text: =selectedWPS.Title
                                    Font: =Font.'Segoe UI'
                                    Size: =14
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wps_DetailCodeBadge:
                                  Control: Badge
                                  Properties:
                                    X: =0
                                    Y: =62
                                    Width: =110
                                    Height: =22
                                    Content: =selectedWPS.Code
                                    Appearance: ='BadgeCanvas.Appearance'.Filled
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    BasePaletteColor: |-
                                      =If(
                                        selectedWPS.Code = "ASME IX",
                                        CodeASMEColor,
                                        CodeAWSColor
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                              - Wps_DetailProcessBadge:
                                  Control: Badge
                                  Properties:
                                    X: =122
                                    Y: =62
                                    Width: =110
                                    Height: =22
                                    Content: =selectedWPS.Process
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    BasePaletteColor: =ThemeSteel
                                    Font: =Font.'Segoe UI'
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                              - Wps_DetailRevisionBadge:
                                  Control: Badge
                                  Properties:
                                    X: =244
                                    Y: =62
                                    Width: =96
                                    Height: =22
                                    Content: =selectedWPS.Revision
                                    Appearance: ='BadgeCanvas.Appearance'.Outline
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    BasePaletteColor: =ThemeTextMuted
                                    Font: =Font.'Segoe UI'
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                              - Wps_OpenPdfButton:
                                  Control: Button
                                  Properties:
                                    X: =Parent.Width - 220
                                    Y: =22
                                    Width: =220
                                    Height: =40
                                    Text: ="Open PDF in SharePoint"
                                    Icon: ="DocumentPdf"
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =ThemeAccent
                                    Font: =Font.'Segoe UI'
                                    FontSize: =13
                                    FontWeight: =FontWeight.Semibold
                                    OnSelect: |-
                                      =If(
                                        !IsBlank(selectedWPS) && !IsBlank(selectedWPS.DocumentUrl),
                                        Launch(selectedWPS.DocumentUrl)
                                      )
                        - Wps_HeaderDivider:
                            Control: Rectangle
                            Properties:
                              Height: =1
                              FillPortions: =0
                              Fill: =ThemeBorder
                              BorderThickness: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - Wps_RangeSectionHeader:
                            Control: ModernText
                            Properties:
                              Height: =26
                              FillPortions: =0
                              Text: ="Qualification Range"
                              Font: =Font.'Segoe UI'
                              Size: =18
                              FontWeight: =FontWeight.Semibold
                              Color: =ThemeText
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - Wps_RangeGrid:
                            Control: GroupContainer
                            Variant: GridLayout
                            Properties:
                              Height: =320
                              FillPortions: =0
                              Fill: =ThemeBgSubtle
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              LayoutGridColumns: =2
                              LayoutGridRows: =5
                              LayoutGap: =1
                              LayoutGridColumnMinWidth: =200
                              LayoutGridRowMinHeight: =60
                              PaddingTop: =1
                              PaddingBottom: =1
                              PaddingLeft: =1
                              PaddingRight: =1
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Stretch
                            Children:
                              - Wps_CellCode:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =ThemeBgCard
                                    BorderThickness: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                  Children:
                                    - Wps_CodeLabel:
                                        Control: ModernText
                                        Properties:
                                          X: =16
                                          Y: =10
                                          Width: =Parent.Width - 32
                                          Height: =16
                                          Text: ="CODE"
                                          Font: =Font.'Segoe UI'
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeTextSubtle
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - Wps_CodeValue:
                                        Control: ModernText
                                        Properties:
                                          X: =16
                                          Y: =28
                                          Width: =Parent.Width - 32
                                          Height: =22
                                          Text: =selectedWPS.Code
                                          Font: =Font.'Segoe UI'
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeText
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - Wps_CellProcess:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =ThemeBgCard
                                    BorderThickness: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                  Children:
                                    - Wps_ProcessLabel:
                                        Control: ModernText
                                        Properties:
                                          X: =16
                                          Y: =10
                                          Width: =Parent.Width - 32
                                          Height: =16
                                          Text: ="PROCESS"
                                          Font: =Font.'Segoe UI'
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ThemeTextSubtle
                                          Wrap: =false
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - Wps_ProcessValue:
                                        Control: ModernText
                                        Properties:
                                          X: =16
                                          Y: =28
                                          Width: =Parent.Width - 32
                                          Height: =22
                                          Text: =selectedWPS.Process
