Screens:
  Welders:
    Properties:
      Fill: =ThemeBgPage
      OnVisible: |-
        =Set(activeNav, "Welders");
        Set(welderSearch, "");
        Set(welderStatusFilter, "All");
        Refresh('Welder Registry');
        If(IsBlank(selectedWelder), Set(selectedWelder, First('Welder Registry')))
    Children:
      - Wd_NavRail:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =160
            Height: =Parent.Height
            Fill: =ThemeNavyDeep
            BorderThickness: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
          Children:
            - Wd_NavBtnHome:
                Control: Button
                Properties:
                  X: =8
                  Y: =24
                  Width: =144
                  Height: =48
                  Icon: ="Home"
                  Text: ="Home"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =RGBA(255, 255, 255, 1)
                  BasePaletteColor: =ThemeNavyDeep
                  AccessibleLabel: ="Home"
                  OnSelect: =Navigate(Home)
            - Wd_NavBtnWelders:
                Control: Button
                Properties:
                  X: =8
                  Y: =84
                  Width: =144
                  Height: =48
                  Icon: ="Person"
                  Text: ="Welders"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  BasePaletteColor: =ThemeAccent
                  AccessibleLabel: ="Welders"
                  OnSelect: =false
            - Wd_NavBtnWPS:
                Control: Button
                Properties:
                  X: =8
                  Y: =144
                  Width: =144
                  Height: =48
                  Icon: ="DocumentBulletList"
                  Text: ="WPS"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =RGBA(255, 255, 255, 1)
                  BasePaletteColor: =ThemeNavyDeep
                  AccessibleLabel: ="WPS"
                  OnSelect: =Navigate(WPS)
            - Wd_NavBtnPQR:
                Control: Button
                Properties:
                  X: =8
                  Y: =204
                  Width: =144
                  Height: =48
                  Icon: ="DocumentEdit"
                  Text: ="PQR"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =RGBA(255, 255, 255, 1)
                  BasePaletteColor: =ThemeNavyDeep
                  AccessibleLabel: ="PQR"
                  OnSelect: =Navigate(PQR)
            - Wd_NavBtnWPQ:
                Control: Button
                Properties:
                  X: =8
                  Y: =264
                  Width: =144
                  Height: =48
                  Icon: ="Ribbon"
                  Text: ="WPQ"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =RGBA(255, 255, 255, 1)
                  BasePaletteColor: =ThemeNavyDeep
                  AccessibleLabel: ="WPQ"
                  OnSelect: =Navigate(WPQ)
            - Wd_NavBtnDocuments:
                Control: Button
                Properties:
                  X: =8
                  Y: =324
                  Width: =144
                  Height: =48
                  Icon: ="Folder"
                  Text: ="Documents"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =RGBA(255, 255, 255, 1)
                  BasePaletteColor: =ThemeNavyDeep
                  AccessibleLabel: ="Documents"
                  OnSelect: =Navigate(Documents)
            - Wd_NavBtnSettings:
                Control: Button
                Properties:
                  X: =8
                  Y: =384
                  Width: =144
                  Height: =48
                  Icon: ="Settings"
                  Text: ="Settings"
                  Align: =Align.Left
                  FontWeight: =FontWeight.Semibold
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  FontColor: =RGBA(255, 255, 255, 1)
                  BasePaletteColor: =ThemeNavyDeep
                  AccessibleLabel: ="Settings"
                  OnSelect: =Navigate(Settings)
      - Wd_PageShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =160
            Y: =0
            Width: =Parent.Width - 160
            Height: =Parent.Height
            Fill: =ThemeBgPage
            BorderThickness: =0
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
          Children:
            - Wd_PageHeader:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Height: =64
                  Fill: =ThemeNavy
                  BorderThickness: =0
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - Wd_PageTitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =16
                        Width: =400
                        Height: =32
                        Text: ="Welders"
                        Font: =Font.'Segoe UI'
                        Size: =22
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(255, 255, 255, 1)
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Wd_PageSubtitle:
                      Control: ModernText
                      Properties:
                        X: =24
                        Y: =44
                        Width: =400
                        Height: =16
                        Text: ="Welder registry, qualifications, and continuity"
                        Font: =Font.'Segoe UI'
                        Size: =11
                        FontWeight: =FontWeight.Normal
                        Color: =ThemeTextSubtle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - Wd_NewWelderBtn:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 264
                        Y: =12
                        Width: =152
                        Height: =40
                        Text: ="+ New Welder"
                        Icon: ="Add"
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        IconStyle: ='ButtonCanvas.IconStyle'.Outline
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =ThemeAccent
                        FontWeight: =FontWeight.Semibold
                        AccessibleLabel: ="Add a new welder"
                        OnSelect: |-
                          =Set(showWelderForm, true);
                          Set(showNotifications, false);
                          Set(showProfileMenu, false);
                          Set(welderFormError, "")
                  - Wd_NotifBell:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 104
                        Y: =12
                        Width: =40
                        Height: =40
                        Icon: ="Alert"
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        IconStyle: ='ButtonCanvas.IconStyle'.Outline
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =ThemeBgCard
                        BasePaletteColor: =ThemeAccent
                        AccessibleLabel: ="Expiring qualifications"
                        OnSelect: |-
                          =Set(showNotifications, !showNotifications); Set(showProfileMenu, false)
                  - Wd_NotifBadge:
                      Control: Rectangle
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Fill: =StatusExpired
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Wd_NotifBadgeText:
                      Control: ModernText
                      Properties:
                        X: =Parent.Width - 86
                        Y: =10
                        Width: =22
                        Height: =18
                        Text: |-
                          =Text(CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())))
                        Color: =RGBA(255, 255, 255, 1)
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Font: =Font.'Segoe UI'
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Visible: |-
                          =CountRows(Filter('WPQ Qualifications', ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days) && ExpirationDate >= Today())) > 0
                  - Wd_UserAvatar:
                      Control: Avatar
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Name: =User().FullName
                        Image: =User().Image
                        Shape: ='Avatar.Shape'.Circular
                        Appearance: ='Avatar.Appearance'.Colorful
                        AccessibleLabel: ="Current user — " & User().FullName
                  - Wd_UserAvatarClick:
                      Control: Button
                      Properties:
                        X: =Parent.Width - 56
                        Y: =12
                        Width: =40
                        Height: =40
                        Text: =""
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BasePaletteColor: =RGBA(0, 0, 0, 0.001)
                        BorderThickness: =0
                        BorderRadius: =20
                        AccessibleLabel: ="Open user menu"
                        OnSelect: |-
                          =Set(showProfileMenu, !showProfileMenu); Set(showNotifications, false)
            - Wd_PageContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =ThemeBgPage
                  BorderThickness: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                Children:
                  - Wd_LeftPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Width: =380
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =ThemeBgCard
                        BorderColor: =ThemeBorder
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DropShadow: =DropShadow.Light
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                      Children:
                        - Wd_LeftHeader:
                            Control: ModernText
                            Properties:
                              Height: =24
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="Welder Registry"
                              Font: =Font.'Segoe UI'
                              Size: =18
                              FontWeight: =FontWeight.Semibold
                              Color: =ThemeText
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - Wd_WelderSearchInput:
                            Control: Classic/TextInput
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Color: =ThemeText
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              Size: =13
                              Font: =Font.'Segoe UI'
                              Height: =40
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              HintText: ="Search by name or stamp..."
                              OnChange: =Set(welderSearch, Self.Text)

                              Mode: =TextMode.SingleLine
                        - Wd_WelderStatusFilter:
                            Control: DropDown
                            Properties:
                              Height: =40
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Items: =["All", "Active", "Inactive"]
                              DefaultSelectedItems: =["All"]
                              OnChange: |-
                                =Set(welderStatusFilter, Self.Selected.Value)
                        - Wd_WelderGallery:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              TemplateSize: =76
                              TemplatePadding: =4
                              ShowScrollbar: =true
                              Items: |-
                                =SortByColumns(
                                  Filter(
                                    'Welder Registry',
                                    ((IsBlank(welderSearch) || welderSearch = "") || StartsWith(Title, welderSearch) || StartsWith(WelderStamp, welderSearch))
                                    && ((IsBlank(welderStatusFilter) || welderStatusFilter = "All") || Status.Value = welderStatusFilter)
                                  ),
                                  "Title",
                                  SortOrder.Ascending
                                )
                            Children:
                              - Wd_WelderRowBg:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                    Fill: =If(ThisItem.ID = selectedWelder.ID, ThemeBgSubtle, ThemeBgCard)
                                    HoverFill: =ThemeBgSubtle
                                    PressedFill: =ThemeBgSubtle
                                    BorderThickness: =0
                                    OnSelect: =Set(selectedWelder, ThisItem)
                              - Wd_WelderAvatarCircle:
                                  Control: Circle
                                  Properties:
                                    X: =12
                                    Y: =14
                                    Width: =48
                                    Height: =48
                                    Fill: |-
                                      =Switch(
                                        Mod(Find(Upper(Left(Coalesce(ThisItem.WelderStamp, "A"), 1)), "ABCDEFGHIJKLMNOPQRSTUVWXYZ"), 6),
                                        0, RGBA(0, 90, 158, 1),
                                        1, RGBA(0, 120, 212, 1),
                                        2, RGBA(168, 75, 12, 1),
                                        3, RGBA(16, 124, 16, 1),
                                        4, RGBA(98, 100, 167, 1),
                                        5, RGBA(46, 78, 122, 1)
                                      )
                                    BorderThickness: =0
                              - Wd_WelderAvatarText:
                                  Control: ModernText
                                  Properties:
                                    X: =12
                                    Y: =14
                                    Width: =48
                                    Height: =48
                                    Text: =Substitute(Coalesce(ThisItem.WelderStamp, ""), "-", "")
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(255, 255, 255, 1)
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_WelderName:
                                  Control: ModernText
                                  Properties:
                                    X: =72
                                    Y: =10
                                    Width: =Parent.TemplateWidth - 84
                                    Height: =22
                                    Text: =ThisItem.Title
                                    Font: =Font.'Segoe UI'
                                    Size: =15
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_WelderStampLine:
                                  Control: ModernText
                                  Properties:
                                    X: =72
                                    Y: =32
                                    Width: =Parent.TemplateWidth - 84
                                    Height: =16
                                    Text: '="Stamp: " & Coalesce(ThisItem.WelderStamp, "—")'
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextMuted
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_WelderSupervisorLine:
                                  Control: ModernText
                                  Properties:
                                    X: =72
                                    Y: =50
                                    Width: =Parent.TemplateWidth - 84
                                    Height: =16
                                    Text: '="Supv: " & Coalesce(ThisItem.Supervisor.DisplayName, "—")'
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeTextSubtle
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                        - Wd_WelderEmpty:
                            Control: ModernText
                            Properties:
                              Height: =48
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =Wd_WelderGallery.AllItemsCount = 0
                              Text: ="No welders match your search."
                              Font: =Font.'Segoe UI'
                              Size: =13
                              FontWeight: =FontWeight.Normal
                              Color: =ThemeTextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =true
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                  - Wd_RightPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                      Children:
                        - Wd_ContinuityBanner:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Height: =56
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =StatusExpired
                              BorderThickness: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: |-
                                =Not(IsBlank(selectedWelder)) &&
                                  selectedWelder.Status.Value = "Active" &&
                                  CountRows(
                                    Filter(
                                      'Continuity Log',
                                      Welder_x0020_Stamp = selectedWelder.WelderStamp &&
                                      Activity_x0020_Date >= DateAdd(Today(), -ContinuityWindowDays, TimeUnit.Days)
                                    )
                                  ) = 0
                            Children:
                              - Wd_ContinuityBannerIcon:
                                  Control: Icon
                                  Properties:
                                    X: =16
                                    Y: =16
                                    Width: =24
                                    Height: =24
                                    Icon: ="Warning"
                                    IconColor: =RGBA(255, 255, 255, 1)
                              - Wd_ContinuityBannerTitle:
                                  Control: ModernText
                                  Properties:
                                    X: =48
                                    Y: =8
                                    Width: =Parent.Width - 64
                                    Height: =22
                                    Text: ="REQUIRES REQUALIFICATION"
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(255, 255, 255, 1)
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_ContinuityBannerSub:
                                  Control: ModernText
                                  Properties:
                                    X: =48
                                    Y: =30
                                    Width: =Parent.Width - 64
                                    Height: =18
                                    Text: ="No welding activity logged in the last 6 months (ASME IX QW-322)"
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Normal
                                    Color: =RGBA(255, 230, 230, 1)
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                        - Wd_ProfileCard:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Height: =160
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =ThemeBgCard
                              BorderColor: =ThemeBorder
                              BorderThickness: =1
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              DropShadow: =DropShadow.Light
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              PaddingTop: =20
                              PaddingBottom: =20
                              PaddingLeft: =24
                              PaddingRight: =24
                            Children:
                              - Wd_ProfileAvatarCircle:
                                  Control: Circle
                                  Properties:
                                    X: =24
                                    Y: =24
                                    Width: =96
                                    Height: =96
                                    Fill: |-
                                      =Switch(
                                        Mod(Find(Upper(Left(Coalesce(selectedWelder.WelderStamp, "A"), 1)), "ABCDEFGHIJKLMNOPQRSTUVWXYZ"), 6),
                                        0, RGBA(0, 90, 158, 1),
                                        1, RGBA(0, 120, 212, 1),
                                        2, RGBA(168, 75, 12, 1),
                                        3, RGBA(16, 124, 16, 1),
                                        4, RGBA(98, 100, 167, 1),
                                        5, RGBA(46, 78, 122, 1)
                                      )
                                    BorderThickness: =0
                              - Wd_ProfileAvatarText:
                                  Control: ModernText
                                  Properties:
                                    X: =24
                                    Y: =24
                                    Width: =96
                                    Height: =96
                                    Text: =Substitute(Coalesce(selectedWelder.WelderStamp, ""), "-", "")
                                    Font: =Font.'Segoe UI'
                                    Size: =26
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(255, 255, 255, 1)
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_ProfileName:
                                  Control: ModernText
                                  Properties:
                                    X: =144
                                    Y: =20
                                    Width: =500
                                    Height: =36
                                    Text: =Coalesce(selectedWelder.Title, "Select a welder")
                                    Font: =Font.'Segoe UI'
                                    Size: =28
                                    FontWeight: =FontWeight.Bold
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_ProfileStampLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =144
                                    Y: =60
                                    Width: =80
                                    Height: =16
                                    Text: ="STAMP"
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ThemeTextSubtle
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_ProfileStampValue:
                                  Control: ModernText
                                  Properties:
                                    X: =144
                                    Y: =76
                                    Width: =200
                                    Height: =22
                                    Text: =Coalesce(selectedWelder.WelderStamp, "—")
                                    Font: =Font.'Segoe UI'
                                    Size: =15
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_ProfileSupervisorLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =360
                                    Y: =60
                                    Width: =120
                                    Height: =16
                                    Text: ="SUPERVISOR"
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ThemeTextSubtle
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_ProfileSupervisorValue:
                                  Control: ModernText
                                  Properties:
                                    X: =360
                                    Y: =76
                                    Width: =260
                                    Height: =22
                                    Text: =Coalesce(selectedWelder.Supervisor.DisplayName, "—")
                                    Font: =Font.'Segoe UI'
                                    Size: =15
                                    FontWeight: =FontWeight.Normal
                                    Color: =ThemeText
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - Wd_ProfileHireLabel:
                                  Control: ModernText
                                  Properties:
                                    X: =144
                                    Y: =104
                                    Width: =120
                                    Height: =16
                                    Text: ="HIRE DATE"
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    FontWeight: =FontWeight.Semibold
