                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  Appearance: ='ButtonCanvas.Appearance'.Subtle
                  BasePaletteColor: =ThemeAccent
                  Align: =Align.Left
                  OnSelect: |-
                    =Launch("https://myaccount.microsoft.com"); Set(showProfileMenu, false)
            - Wd_ProfileBtnAbout:
                Control: Button
                Properties:
                  X: =16
                  Y: =152
                  Width: =Parent.Width - 32
                  Height: =40
                  Text: ="About this app"
                  Icon: ="Info"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  Appearance: ='ButtonCanvas.Appearance'.Subtle
                  BasePaletteColor: =ThemeAccent
                  Align: =Align.Left
                  OnSelect: =Set(showProfileMenu, false); Navigate(Settings)

      - Wd_NewWelderScrim:
          Control: Button
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Text: =""
            Visible: =showWelderForm
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            BasePaletteColor: =RGBA(0, 0, 0, 0.4)
            BorderThickness: =0
            AccessibleLabel: ="Close form"
            OnSelect: =Set(showWelderForm, false)
      - Wd_NewWelderForm:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - 480) / 2
            Y: =(Parent.Height - 600) / 2
            Width: =480
            Height: =600
            Fill: =ThemeBgCard
            BorderColor: =ThemeBorder
            BorderThickness: =1
            DropShadow: =DropShadow.Bold
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            Visible: =showWelderForm
          Children:
            - Wd_NWFTitle:
                Control: ModernText
                Properties:
                  X: =24
                  Y: =20
                  Width: =400
                  Height: =28
                  Text: ="Add Welder"
                  Font: =Font.'Segoe UI'
                  Size: =18
                  FontWeight: =FontWeight.Bold
                  Color: =ThemeText
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFSubtitle:
                Control: ModernText
                Properties:
                  X: =24
                  Y: =48
                  Width: =400
                  Height: =18
                  Text: ="Add a new welder to the registry"
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Normal
                  Color: =ThemeTextMuted
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFCloseBtn:
                Control: Button
                Properties:
                  X: =Parent.Width - 44
                  Y: =16
                  Width: =32
                  Height: =32
                  Icon: ="Dismiss"
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  IconStyle: ='ButtonCanvas.IconStyle'.Outline
                  Appearance: ='ButtonCanvas.Appearance'.Subtle
                  BasePaletteColor: =ThemeTextMuted
                  AccessibleLabel: ="Close"
                  OnSelect: =Set(showWelderForm, false)
            - Wd_NWFDivider:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =80
                  Width: =Parent.Width
                  Height: =1
                  Fill: =ThemeBorder
                  BorderThickness: =0
            - Wd_NWFNameLabel:
                Control: ModernText
                Properties:
                  X: =24
                  Y: =96
                  Width: =200
                  Height: =18
                  Text: ="Welder Name *"
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =ThemeTextMuted
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFNameInput:
                Control: Classic/TextInput
                Properties:
                  X: =24
                  Y: =116
                  Width: =Parent.Width - 48
                  Height: =40
                  HintText: ="Julian Andrews"
                  Mode: =TextMode.SingleLine
                  Size: =13
                  Color: =ThemeText
                  Font: =Font.'Segoe UI'
                  BorderColor: =ThemeBorder
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - Wd_NWFStampLabel:
                Control: ModernText
                Properties:
                  X: =24
                  Y: =168
                  Width: =200
                  Height: =18
                  Text: ="Welder Stamp *"
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =ThemeTextMuted
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFStampInput:
                Control: Classic/TextInput
                Properties:
                  X: =24
                  Y: =188
                  Width: =200
                  Height: =40
                  HintText: ="A-12"
                  Mode: =TextMode.SingleLine
                  Size: =13
                  Color: =ThemeText
                  Font: =Font.'Segoe UI'
                  BorderColor: =ThemeBorder
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - Wd_NWFStatusLabel:
                Control: ModernText
                Properties:
                  X: =244
                  Y: =168
                  Width: =200
                  Height: =18
                  Text: ="Status"
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =ThemeTextMuted
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFStatusDropdown:
                Control: DropDown
                Properties:
                  X: =244
                  Y: =188
                  Width: =Parent.Width - 268
                  Height: =40
                  Items: =["Active", "Inactive"]
                  DefaultSelectedItems: =["Active"]
            - Wd_NWFHireDateLabel:
                Control: ModernText
                Properties:
                  X: =24
                  Y: =240
                  Width: =200
                  Height: =18
                  Text: ="Hire Date"
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =ThemeTextMuted
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFHireDatePicker:
                Control: DatePicker
                Properties:
                  X: =24
                  Y: =260
                  Width: =200
                  Height: =40
                  SelectedDate: =Today()
            - Wd_NWFProjectLabel:
                Control: ModernText
                Properties:
                  X: =244
                  Y: =240
                  Width: =200
                  Height: =18
                  Text: ="Current Project"
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =ThemeTextMuted
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFProjectInput:
                Control: Classic/TextInput
                Properties:
                  X: =244
                  Y: =260
                  Width: =Parent.Width - 268
                  Height: =40
                  HintText: ="Project name"
                  Mode: =TextMode.SingleLine
                  Size: =13
                  Color: =ThemeText
                  Font: =Font.'Segoe UI'
                  BorderColor: =ThemeBorder
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - Wd_NWFNotesLabel:
                Control: ModernText
                Properties:
                  X: =24
                  Y: =312
                  Width: =200
                  Height: =18
                  Text: ="Notes"
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =ThemeTextMuted
                  Wrap: =false
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFNotesInput:
                Control: Classic/TextInput
                Properties:
                  X: =24
                  Y: =332
                  Width: =Parent.Width - 48
                  Height: =100
                  HintText: ="Optional notes about this welder..."
                  Mode: =TextMode.MultiLine
                  Size: =13
                  Color: =ThemeText
                  Font: =Font.'Segoe UI'
                  BorderColor: =ThemeBorder
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - Wd_NWFErrorText:
                Control: ModernText
                Properties:
                  X: =24
                  Y: =446
                  Width: =Parent.Width - 48
                  Height: =40
                  Visible: =Not(IsBlank(welderFormError))
                  Text: =welderFormError
                  Font: =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Normal
                  Color: =StatusExpired
                  Wrap: =true
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - Wd_NWFFooterDivider:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =Parent.Height - 72
                  Width: =Parent.Width
                  Height: =1
                  Fill: =ThemeBorder
                  BorderThickness: =0
            - Wd_NWFCancelBtn:
                Control: Button
                Properties:
                  X: =Parent.Width - 232
                  Y: =Parent.Height - 56
                  Width: =104
                  Height: =40
                  Text: ="Cancel"
                  Layout: ='ButtonCanvas.Layout'.TextOnly
                  Appearance: ='ButtonCanvas.Appearance'.Subtle
                  BasePaletteColor: =ThemeTextMuted
                  AccessibleLabel: ="Cancel"
                  OnSelect: =Set(showWelderForm, false)
            - Wd_NWFSaveBtn:
                Control: Button
                Properties:
                  X: =Parent.Width - 120
                  Y: =Parent.Height - 56
                  Width: =104
                  Height: =40
                  Text: ="Save Welder"
                  Layout: ='ButtonCanvas.Layout'.TextOnly
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  BasePaletteColor: =ThemeAccent
                  FontWeight: =FontWeight.Semibold
                  AccessibleLabel: ="Save welder"
                  OnSelect: |-
                    =If(
                      IsBlank(Wd_NWFNameInput.Text) || IsBlank(Wd_NWFStampInput.Text),
                      Set(welderFormError, "Welder name and stamp are required."),
                      If(
                        CountRows(Filter('Welder Registry', WelderStamp = Wd_NWFStampInput.Text)) > 0,
                        Set(welderFormError, "A welder with that stamp already exists."),
                        Patch(
                          'Welder Registry',
                          Defaults('Welder Registry'),
                          {
                            Title: Wd_NWFNameInput.Text,
                            WelderStamp: Wd_NWFStampInput.Text,
                            Status: {Value: Wd_NWFStatusDropdown.Selected.Value},
                            HireDate: Wd_NWFHireDatePicker.SelectedDate,
                            CurrentProject: Wd_NWFProjectInput.Text,
                            Notes: Wd_NWFNotesInput.Text
                          }
                        );
                        Refresh('Welder Registry');
                        Set(showWelderForm, false);
                        Set(welderFormError, "");
                        Reset(Wd_NWFNameInput);
                        Reset(Wd_NWFStampInput);
                        Reset(Wd_NWFProjectInput);
                        Reset(Wd_NWFNotesInput)
                      )
                    )
